services:
  api:
    environment:
      LIYAN_MEMORY_DIAGNOSTICS: "false"
      LIYAN_MEMORY_CHECKPOINT_DIR: ""
      LIYAN_JEMALLOC_PROFILE_DIR: ""
      LIYAN_BOUNDED_MEMORY_INVENTORY_DIR: /gate-c-results/bounded-memory-inventory
      LIYAN_BOUNDED_MEMORY_INVENTORY_SOURCE_SHA: ${GATE_C_SOURCE_SHA:?GATE_C_SOURCE_SHA is required}
      LIYAN_BOUNDED_MEMORY_INVENTORY_SOURCE_TREE: ${GATE_C_SOURCE_TREE:?GATE_C_SOURCE_TREE is required}
      LIYAN_BOUNDED_MEMORY_INVENTORY_PRODUCT_SOURCE_SHA: ${GATE_C_PRODUCT_SOURCE_SHA:?GATE_C_PRODUCT_SOURCE_SHA is required}
      LIYAN_BOUNDED_MEMORY_INVENTORY_ENGINEERING_BASELINE_SHA: ${GATE_C_ENGINEERING_BASELINE_SHA:?GATE_C_ENGINEERING_BASELINE_SHA is required}
      LIYAN_BOUNDED_MEMORY_INVENTORY_PROCESS_VERSION: ${GATE_C_PROCESS_VERSION:?GATE_C_PROCESS_VERSION is required}
    volumes:
      - ${GATE_C_RESULTS_DIR:?GATE_C_RESULTS_DIR is required}:/gate-c-results
