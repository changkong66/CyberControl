services:
  postgres:
    image: ${GATE_C_POSTGRES_IMAGE:?GATE_C_POSTGRES_IMAGE is required}
    environment:
      POSTGRES_DB: gate_c_calibration
      POSTGRES_USER: gate_c_calibration
      POSTGRES_PASSWORD_FILE: /run/gate-c-secrets/postgres-password
    entrypoint:
      - /bin/sh
      - /gate-c-scripts/postgres-calibration-entrypoint.sh
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/run/postgresql/gate-c-tls/server.crt
      - -c
      - ssl_key_file=/run/postgresql/gate-c-tls/server.key
      - -c
      - ssl_ca_file=/run/postgresql/gate-c-tls/ca.crt
      - -c
      - password_encryption=scram-sha-256
      - -c
      - max_connections=250
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          PGPASSWORD="$$(cat /run/gate-c-secrets/postgres-password)"
          psql "host=postgres port=5432 dbname=gate_c_calibration
          user=gate_c_calibration sslmode=verify-full
          sslrootcert=/run/gate-c-tls/ca.crt" --no-psqlrc --tuples-only
          --command='SELECT 1' >/dev/null
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
    volumes:
      - gate-c-calibration-postgres:/var/lib/postgresql/data
      - ${GATE_C_TLS_DIR:?GATE_C_TLS_DIR is required}:/run/gate-c-tls:ro
      - ${GATE_C_SECRETS_DIR:?GATE_C_SECRETS_DIR is required}:/run/gate-c-secrets:ro
      - ./gate_c/postgres_calibration_tls_init.sh:/docker-entrypoint-initdb.d/010-calibration-tls.sh:ro
      - ./gate_c/postgres_calibration_entrypoint.sh:/gate-c-scripts/postgres-calibration-entrypoint.sh:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /run/postgresql:size=16m,uid=70,gid=70,mode=0770
    security_opt:
      - no-new-privileges:true
    restart: "no"

  calibration:
    image: ${GATE_C_DIAGNOSTIC_IMAGE_REFERENCE:?GATE_C_DIAGNOSTIC_IMAGE_REFERENCE is required}
    command:
      - python
      - /opt/cybercontrol/jemalloc-prof/bin/rss-calibration
      - --arm
      - ${GATE_C_CALIBRATION_ARM:?GATE_C_CALIBRATION_ARM is required}
      - --variable
      - ${GATE_C_CALIBRATION_VARIABLE:?GATE_C_CALIBRATION_VARIABLE is required}
      - --run-id
      - ${GATE_C_CALIBRATION_RUN_ID:?GATE_C_CALIBRATION_RUN_ID is required}
      - --database-host
      - postgres
      - --database-port
      - "5432"
      - --database-name
      - gate_c_calibration
      - --database-user
      - gate_c_calibration
      - --database-password-file
      - /run/gate-c-secrets/postgres-password
      - --tls-ca
      - /run/gate-c-tls/ca.crt
      - --tls-server-certificate
      - /run/gate-c-tls/server.crt
      - --tls-server-hostname
      - postgres
      - --output
      - /gate-c-results/calibration-arm.json
      - --readiness-output
      - /gate-c-results/instrumentation-ready.json
      - --idle-seconds
      - ${GATE_C_CALIBRATION_IDLE_SECONDS:-300}
      - --recovery-seconds
      - ${GATE_C_CALIBRATION_RECOVERY_SECONDS:-600}
    environment:
      LIYAN_MEMORY_DIAGNOSTICS: "false"
      LIYAN_MEMORY_CHECKPOINT_DIR: ""
      LIYAN_BOUNDED_MEMORY_INVENTORY_DIR: ""
      LIYAN_JEMALLOC_PROFILE_DIR: ""
      GATE_C_SOURCE_SHA: ${GATE_C_SOURCE_SHA:?GATE_C_SOURCE_SHA is required}
      GATE_C_SOURCE_TREE: ${GATE_C_SOURCE_TREE:?GATE_C_SOURCE_TREE is required}
      GATE_C_PRODUCT_SOURCE_SHA: ${GATE_C_PRODUCT_SOURCE_SHA:?GATE_C_PRODUCT_SOURCE_SHA is required}
      GATE_C_ENGINEERING_BASELINE_SHA: ${GATE_C_ENGINEERING_BASELINE_SHA:?GATE_C_ENGINEERING_BASELINE_SHA is required}
      GATE_C_DIAGNOSTIC_IMAGE_ID: ${GATE_C_DIAGNOSTIC_IMAGE_ID:?GATE_C_DIAGNOSTIC_IMAGE_ID is required}
      GATE_C_DIAGNOSTIC_IMAGE_DIGEST: ${GATE_C_DIAGNOSTIC_IMAGE_DIGEST:?GATE_C_DIAGNOSTIC_IMAGE_DIGEST is required}
      GATE_C_IMAGE_LOCK_SHA256: ${GATE_C_IMAGE_LOCK_SHA256:?GATE_C_IMAGE_LOCK_SHA256 is required}
      GATE_C_BUILD_RECEIPT_SHA256: ${GATE_C_BUILD_RECEIPT_SHA256:?GATE_C_BUILD_RECEIPT_SHA256 is required}
      GATE_C_JEMALLOC_PROFILE_LIBRARY_SHA256: ${GATE_C_JEMALLOC_PROFILE_LIBRARY_SHA256:?GATE_C_JEMALLOC_PROFILE_LIBRARY_SHA256 is required}
      GATE_C_JEMALLOC_PROFILE_LIBRARY_BUILD_ID: ${GATE_C_JEMALLOC_PROFILE_LIBRARY_BUILD_ID:?GATE_C_JEMALLOC_PROFILE_LIBRARY_BUILD_ID is required}
    volumes:
      - ${GATE_C_RESULTS_DIR:?GATE_C_RESULTS_DIR is required}:/gate-c-results
      - ${GATE_C_TLS_DIR:?GATE_C_TLS_DIR is required}:/run/gate-c-tls:ro
      - ${GATE_C_SECRETS_DIR:?GATE_C_SECRETS_DIR is required}:/run/gate-c-secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    restart: "no"

volumes:
  gate-c-calibration-postgres:
    external: true
    name: ${GATE_C_POSTGRES_VOLUME:?GATE_C_POSTGRES_VOLUME is required}
