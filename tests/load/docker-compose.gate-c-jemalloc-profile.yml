services:
  api:
    image: cybercontrol/gate-c-jemalloc-profile:${GATE_C_IMAGE_TAG:-unknown}
    build:
      context: ..
      dockerfile: tests/load/jemalloc-profile.Dockerfile
      args:
        BACKEND_IMAGE: cybercontrol/gate-c-backend:${GATE_C_IMAGE_TAG:-unknown}
        CYBERCONTROL_SOURCE_SHA: ${GATE_C_SOURCE_SHA:-unknown}
        CYBERCONTROL_SOURCE_TREE: ${GATE_C_SOURCE_TREE:-unknown}
        CYBERCONTROL_PRODUCT_SOURCE_SHA: ${GATE_C_PRODUCT_SOURCE_SHA:-unknown}
        CYBERCONTROL_ENGINEERING_BASELINE_SHA: ${GATE_C_ENGINEERING_BASELINE_SHA:-unknown}
        CYBERCONTROL_PROCESS_VERSION: ${GATE_C_PROCESS_VERSION:-unknown}
    environment:
      LIYAN_MEMORY_DIAGNOSTICS: "false"
      LIYAN_MEMORY_CHECKPOINT_DIR: ""
      LIYAN_JEMALLOC_PROFILE_DIR: /gate-c-results/jemalloc-profile
      LIYAN_JEMALLOC_PROFILE_SOURCE_SHA: ${GATE_C_SOURCE_SHA:?GATE_C_SOURCE_SHA is required}
      LIYAN_JEMALLOC_PROFILE_SOURCE_TREE: ${GATE_C_SOURCE_TREE:?GATE_C_SOURCE_TREE is required}
      LIYAN_JEMALLOC_PROFILE_PRODUCT_SOURCE_SHA: ${GATE_C_PRODUCT_SOURCE_SHA:?GATE_C_PRODUCT_SOURCE_SHA is required}
      LIYAN_JEMALLOC_PROFILE_ENGINEERING_BASELINE_SHA: ${GATE_C_ENGINEERING_BASELINE_SHA:?GATE_C_ENGINEERING_BASELINE_SHA is required}
      LIYAN_JEMALLOC_PROFILE_PROCESS_VERSION: ${GATE_C_PROCESS_VERSION:?GATE_C_PROCESS_VERSION is required}
      LIYAN_JEMALLOC_PROFILE_LIBRARY_SHA256: ${GATE_C_JEMALLOC_PROFILE_LIBRARY_SHA256:-unresolved}
      LIYAN_JEMALLOC_PROFILE_LIBRARY_BUILD_ID: ${GATE_C_JEMALLOC_PROFILE_LIBRARY_BUILD_ID:-unresolved}
      LIYAN_JEMALLOC_PROFILE_IMAGE_ID: ${GATE_C_JEMALLOC_PROFILE_IMAGE_ID:-unresolved}
      LIYAN_JEMALLOC_PROFILE_IMAGE_DIGEST: ${GATE_C_JEMALLOC_PROFILE_IMAGE_DIGEST:-unresolved}
    volumes:
      - ${GATE_C_RESULTS_DIR:?GATE_C_RESULTS_DIR is required}:/gate-c-results
