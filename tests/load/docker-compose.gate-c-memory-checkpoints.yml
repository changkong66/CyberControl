services:
  api:
    environment:
      LIYAN_MEMORY_DIAGNOSTICS: "false"
      LIYAN_MEMORY_CHECKPOINT_DIR: /gate-c-results/memory-checkpoints
      LIYAN_MEMORY_CHECKPOINT_SOURCE_SHA: ${GATE_C_SOURCE_SHA:?GATE_C_SOURCE_SHA is required}
      LIYAN_MEMORY_CHECKPOINT_SOURCE_TREE: ${GATE_C_SOURCE_TREE:?GATE_C_SOURCE_TREE is required}
      LIYAN_MEMORY_CHECKPOINT_PRODUCT_SOURCE_SHA: ${GATE_C_PRODUCT_SOURCE_SHA:?GATE_C_PRODUCT_SOURCE_SHA is required}
      LIYAN_MEMORY_CHECKPOINT_ENGINEERING_BASELINE_SHA: ${GATE_C_ENGINEERING_BASELINE_SHA:?GATE_C_ENGINEERING_BASELINE_SHA is required}
      LIYAN_MEMORY_CHECKPOINT_PROCESS_VERSION: ${GATE_C_PROCESS_VERSION:?GATE_C_PROCESS_VERSION is required}
      LIYAN_MEMORY_CHECKPOINT_FRAMES: "25"
    volumes:
      - ${GATE_C_RESULTS_DIR:?GATE_C_RESULTS_DIR is required}:/gate-c-results
